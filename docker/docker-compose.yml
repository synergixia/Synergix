networks:
  synergix-net:
    name: synergix-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  thinker-cache:
    name: synergix-thinker-cache
    driver: local
  judge-cache:
    name: synergix-judge-cache
    driver: local

services:
  # Thinker LLM — Qwen2.5-7B-Instruct Q4_K_M on CPU (Ryzen 9 7900, 12C/24T).
  thinker:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: synergix-thinker
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ../aisynergix/ai/models/qwen2.5-7b-instruct-q4_k_m.gguf:/models/synergix.gguf:ro
      - thinker-cache:/tmp
    entrypoint: ["/app/llama-server"]
    command:
      - "-m"
      - "/models/synergix.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "-c"
      - "8192"
      - "-t"
      - "12"
      - "-tb"
      - "12"
      - "--no-mmap"
      - "--temp"
      - "0.7"
      - "--top-k"
      - "20"
      - "--top-p"
      - "0.8"
      - "--repeat-penalty"
      - "1.05"
      - "-n"
      - "2048"
      - "--parallel"
      - "1"
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: "12.0G"
        reservations:
          cpus: "6.0"
          memory: "6.0G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  judge:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: synergix-judge
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.11
    volumes:
      - ../aisynergix/ai/models/qwen2.5-1.5b-q8.gguf:/models/model.gguf:ro
      - judge-cache:/tmp
    entrypoint: ["/app/llama-server"]
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "4096"
      - "-t"
      - "6"
      - "-tb"
      - "6"
      - "--no-mmap"
      - "--temp"
      - "0.1"
      - "--top-k"
      - "20"
      - "--repeat-penalty"
      - "1.0"
      - "-n"
      - "320"
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: "4.0G"
        reservations:
          cpus: "1.0"
          memory: "2.0G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  irys-uploader:
    build:
      context: ../irys-uploader
      dockerfile: Dockerfile
    container_name: synergix-irys-uploader
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.30
    environment:
      PRIVATE_KEY: ${PRIVATE_KEY:?err}
      IRYS_TOKEN: ${IRYS_TOKEN:-bnb}
      IRYS_NODE_URL: ${IRYS_NODE_URL:-https://uploader.irys.xyz}
      PORT: "8083"
      NODE_ENV: production
    ports:
      - "127.0.0.1:8083:8083"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.2"
          memory: "192M"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8083/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Private metasearch engine (SearXNG) — the web-search fallback for the Thinker.
  # Internal-only; the bot queries its JSON API on the docker network.
  searxng:
    image: searxng/searxng:latest
    container_name: synergix-searxng
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.12
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API pública de solo lectura (Fase 3, §7.4) — nodos, Passports, impacto.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: synergix-api
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.40
    command:
      ["python", "-m", "uvicorn", "aisynergix.api:app",
       "--host", "0.0.0.0", "--port", "8090"]
    environment:
      PRIVATE_KEY: ${PRIVATE_KEY:?err}
      IRYS_NODE_URL: ${IRYS_NODE_URL:-https://uploader.irys.xyz}
      IRYS_GATEWAY_URL: ${IRYS_GATEWAY_URL:-https://gateway.irys.xyz}
      IRYS_TOKEN: ${IRYS_TOKEN:-bnb}
      IRYS_UPLOADER_URL: ${IRYS_UPLOADER_URL:-http://irys-uploader:8083}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?err}
      HF_HOME: /tmp/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /tmp/st_cache
    ports:
      - "127.0.0.1:8090:8090"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1.0G"
        reservations:
          cpus: "0.2"
          memory: "256M"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: synergix-bot
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.20
    depends_on:
      thinker:
        condition: service_started
      judge:
        condition: service_started
      irys-uploader:
        condition: service_started
      searxng:
        condition: service_started
      # No image-gen dependency: image generation is handled by Fal.ai (external).
    # ═══════════════════════════════════════════════════════════════
    # VARIABLES DE ENTORNO — SOLO LAS QUE NECESITA CADA COMPONENTE
    # ═══════════════════════════════════════════════════════════════
    environment:
      # ── Wallet / Irys ─────────────────────────────────────────
      PRIVATE_KEY: ${PRIVATE_KEY:?err}
      # Clave maestra de las wallets custodiales (vacía = función apagada).
      SYNERGIX_WALLET_MASTER_KEY: ${SYNERGIX_WALLET_MASTER_KEY:-}
      IRYS_NODE_URL: ${IRYS_NODE_URL:-https://uploader.irys.xyz}
      IRYS_GATEWAY_URL: ${IRYS_GATEWAY_URL:-https://gateway.irys.xyz}
      IRYS_TOKEN: ${IRYS_TOKEN:-bnb}
      IRYS_UPLOADER_URL: ${IRYS_UPLOADER_URL:-http://irys-uploader:8083}

      # ── Synergix App ──────────────────────────────────────────
      SYNERGIX_TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?err}
      SYNERGIX_THINKER_HOST: ${THINKER_HOST:-http://thinker:8081}
      SYNERGIX_JUDGE_HOST: ${JUDGE_HOST:-http://judge:8080}
      SYNERGIX_CACHE_TTL: ${CACHE_TTL:-12}

      # ── Variables sin prefijo (requeridas por bot.py y local_ia.py) ──
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?err}
      THINKER_HOST: ${THINKER_HOST:-http://thinker:8081}
      JUDGE_HOST: ${JUDGE_HOST:-http://judge:8080}
      # Concurrent Thinker calls allowed. Keep at 1 — the CPU build runs
      # llama.cpp with --parallel 1, so extra requests just queue in asyncio.
      THINKER_MAX_CONCURRENCY: ${THINKER_MAX_CONCURRENCY:-1}

      # ── Image generation (Fal.ai) ─────────────────────────────
      IMAGE_GEN_ENABLED: ${IMAGE_GEN_ENABLED:-true}
      IMAGE_MAX_CONCURRENCY: ${IMAGE_MAX_CONCURRENCY:-3}
      # Fal.ai API key (https://fal.ai/dashboard/keys) + model id.
      FAL_KEY: ${FAL_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux/schnell}

      # ── Group chats ───────────────────────────────────────────
      # Trigger word (whole word, case-insensitive) that makes the bot answer.
      SYNERGIX_GROUP_KEYWORD: ${SYNERGIX_GROUP_KEYWORD:-syn}
      # Language the bot speaks in groups (default English).
      SYNERGIX_GROUP_LANG: ${SYNERGIX_GROUP_LANG:-en}
      # Whitelist of group IDs (negative) where the bot may answer; empty = any.
      SYNERGIX_GROUP_WHITELIST: ${SYNERGIX_GROUP_WHITELIST:-}
      # Min seconds between answers to the same (group, user) — anti-spam.
      SYNERGIX_GROUP_COOLDOWN: ${SYNERGIX_GROUP_COOLDOWN:-5}

      # ── Web search fallback (SearXNG, self-hosted) ────────────
      # Used only when immortal memory has nothing relevant.
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # SearXNG categories to query (general,news covers finance/crypto/sports/tech).
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-general,news}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-8}
      # Only if WEB_SEARCH_PROVIDER=brave:
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # Anti-abuse: seconds between images per user, and max images per user/day.
      IMAGE_COOLDOWN_SECONDS: ${IMAGE_COOLDOWN_SECONDS:-120}
      IMAGE_DAILY_LIMIT: ${IMAGE_DAILY_LIMIT:-10}

      # ── BSC / Trading ─────────────────────────────────────────
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed1.binance.org}
      # Slippage (%) de los swaps custodiales comprar/vender SYNERGIX.
      SYNERGIX_SWAP_SLIPPAGE: ${SYNERGIX_SWAP_SLIPPAGE:-12}
      # Bond de nodos: SYNERGIX real bloqueado para crear un nodo (anti-Sybil).
      SYNERGIX_NODE_BOND: ${SYNERGIX_NODE_BOND:-200000}
      SYNERGIX_UNBOND_DAYS: ${SYNERGIX_UNBOND_DAYS:-7}

      # ── HuggingFace / Transformers ─────────────────────────────
      HF_HOME: /tmp/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /tmp/st_cache
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "6.0G"
        reservations:
          cpus: "1.0"
          memory: "2.0G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import asyncio; from aisynergix.ai.manager import get_ai_manager; asyncio.run(get_ai_manager().health_check())",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
