x-common-env: &common-env
  GREENFIELD_RPC_URL: ${GREENFIELD_RPC_URL:-https://greenfield-chain.bnbchain.world:443}
  GREENFIELD_CHAIN_ID: ${GREENFIELD_CHAIN_ID:-1017}
  BUCKET_NAME: ${BUCKET_NAME:-synergix-v1}
  SP_ENDPOINT: ${SP_ENDPOINT:-https://greenfield-sp.bnbchain.world}
  DCELLAR_SP_ADDRESS: ${DCELLAR_SP_ADDRESS:-}
  BUCKET_ID: ${BUCKET_ID:-}
  PRIVATE_KEY: ${PRIVATE_KEY:?err}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?err}
  THINKER_HOST: ${THINKER_HOST:-http://thinker:8081}
  JUDGE_HOST: ${JUDGE_HOST:-http://judge:8080}
  CACHE_TTL: ${CACHE_TTL:-12}

networks:
  synergix-net:
    name: synergix-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  synergix-tmp:
    name: synergix-tmp
    driver: local
  thinker-cache:
    name: synergix-thinker-cache
    driver: local
  judge-cache:
    name: synergix-judge-cache
    driver: local

services:
  thinker:
    image: ghcr.io/ggerganov/llama.cpp:full-b4570
    container_name: synergix-thinker
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ../models/qwen2.5-1.5b-instruct-q4_k_m.gguf:/models/model.gguf:ro
      - thinker-cache:/tmp
    command:
      - "--model"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--ctx-size"
      - "4096"
      - "--threads"
      - "4"
      - "--threads-batch"
      - "4"
      - "--mlock"
      - "--no-mmap"
      - "--temp"
      - "0.3"
      - "--top-k"
      - "40"
      - "--repeat-penalty"
      - "1.1"
      - "--n-predict"
      - "1024"
      - "--log-disable"
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: "2.5G"
        reservations:
          cpus: "2.0"
          memory: "1.5G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  judge:
    image: ghcr.io/ggerganov/llama.cpp:full-b4570
    container_name: synergix-judge
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.11
    volumes:
      - ../models/qwen2.5-0.5b-instruct-q4_k_m.gguf:/models/model.gguf:ro
      - judge-cache:/tmp
    command:
      - "--model"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "2048"
      - "--threads"
      - "2"
      - "--threads-batch"
      - "2"
      - "--mlock"
      - "--no-mmap"
      - "--temp"
      - "0.1"
      - "--top-k"
      - "20"
      - "--repeat-penalty"
      - "1.0"
      - "--n-predict"
      - "256"
      - "--log-disable"
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "1.0G"
        reservations:
          cpus: "1.0"
          memory: "512M"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: synergix-bot:latest
    container_name: synergix-bot
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.20
    depends_on:
      thinker:
        condition: service_started
      judge:
        condition: service_started
    environment:
      <<: *common-env
    volumes:
      - synergix-tmp:/tmp
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: "3.0G"
        reservations:
          cpus: "1.0"
          memory: "1.5G"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2G
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import asyncio; from aisynergix.ai.manager import get_ai_manager; asyncio.run(get_ai_manager().health_check())",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
