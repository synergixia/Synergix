networks:
  synergix-net:
    name: synergix-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  thinker-cache:
    name: synergix-thinker-cache
    driver: local
  judge-cache:
    name: synergix-judge-cache
    driver: local
  programmer-cache:
    name: synergix-programmer-cache
    driver: local

services:
  thinker:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: synergix-thinker
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ../aisynergix/ai/models/qwen3-1.7b.gguf:/models/model.gguf:ro
      - thinker-cache:/tmp
    entrypoint: ["/app/llama-server"]
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "-c"
      - "4096"
      - "-t"
      - "2"
      - "-tb"
      - "2"
      - "--no-mmap"
      - "--temp"
      - "0.3"
      - "--top-k"
      - "40"
      - "--repeat-penalty"
      - "1.1"
      - "-n"
      - "1024"
      - "--parallel"
      - "2"
      - "--cont-batching"
      - "--flash-attn"
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2.2G"
        reservations:
          cpus: "1.0"
          memory: "1.5G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  judge:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: synergix-judge
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.11
    volumes:
      - ../aisynergix/ai/models/qwen3-0.6b.gguf:/models/model.gguf:ro
      - judge-cache:/tmp
    entrypoint: ["/app/llama-server"]
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-t"
      - "1"
      - "-tb"
      - "1"
      - "--no-mmap"
      - "--temp"
      - "0.1"
      - "--top-k"
      - "20"
      - "--repeat-penalty"
      - "1.0"
      - "-n"
      - "768"
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "0.8G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  programmer:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: synergix-programmer
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.12
    volumes:
      - ../aisynergix/ai/models/starcoder2-3b.gguf:/models/model.gguf:ro
      - programmer-cache:/tmp
    entrypoint: ["/app/llama-server"]
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8082"
      - "-c"
      - "2048"
      - "-t"
      - "1"
      - "-tb"
      - "1"
      - "--no-mmap"
      - "--temp"
      - "0.2"
      - "--top-k"
      - "20"
      - "--repeat-penalty"
      - "1.1"
      - "-n"
      - "2048"
    ports:
      - "127.0.0.1:8082:8082"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2.5G"
        reservations:
          cpus: "1.0"
          memory: "1.8G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  irys-uploader:
    build:
      context: ../irys-uploader
      dockerfile: Dockerfile
    container_name: synergix-irys-uploader
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.30
    environment:
      PRIVATE_KEY: ${PRIVATE_KEY:?err}
      IRYS_TOKEN: ${IRYS_TOKEN:-bnb}
      IRYS_NODE_URL: ${IRYS_NODE_URL:-https://uploader.irys.xyz}
      PORT: "8083"
      NODE_ENV: production
    ports:
      - "127.0.0.1:8083:8083"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.2"
          memory: "192M"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8083/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: synergix-bot
    restart: unless-stopped
    networks:
      synergix-net:
        ipv4_address: 172.28.0.20
    depends_on:
      thinker:
        condition: service_started
      judge:
        condition: service_started
      programmer:
        condition: service_started
      irys-uploader:
        condition: service_started
    # ═══════════════════════════════════════════════════════════════
    # VARIABLES DE ENTORNO — SOLO LAS QUE NECESITA CADA COMPONENTE
    # ═══════════════════════════════════════════════════════════════
    environment:
      # ── Wallet / Irys ─────────────────────────────────────────
      PRIVATE_KEY: ${PRIVATE_KEY:?err}
      IRYS_NODE_URL: ${IRYS_NODE_URL:-https://uploader.irys.xyz}
      IRYS_GATEWAY_URL: ${IRYS_GATEWAY_URL:-https://gateway.irys.xyz}
      IRYS_TOKEN: ${IRYS_TOKEN:-bnb}
      IRYS_UPLOADER_URL: ${IRYS_UPLOADER_URL:-http://irys-uploader:8083}

      # ── Synergix App ──────────────────────────────────────────
      SYNERGIX_TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?err}
      SYNERGIX_THINKER_HOST: ${THINKER_HOST:-http://thinker:8081}
      SYNERGIX_JUDGE_HOST: ${JUDGE_HOST:-http://judge:8080}
      SYNERGIX_PROGRAMMER_HOST: ${PROGRAMMER_HOST:-http://programmer:8082}
      SYNERGIX_CACHE_TTL: ${CACHE_TTL:-12}

      # ── Variables sin prefijo (requeridas por bot.py y local_ia.py) ──
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?err}
      THINKER_HOST: ${THINKER_HOST:-http://thinker:8081}
      JUDGE_HOST: ${JUDGE_HOST:-http://judge:8080}
      PROGRAMMER_HOST: ${PROGRAMMER_HOST:-http://programmer:8082}

      # ── BSC / Trading ─────────────────────────────────────────
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed1.binance.org}

      # ── HuggingFace / Transformers ─────────────────────────────
      HF_HOME: /tmp/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /tmp/st_cache
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2.5G"
        reservations:
          cpus: "1.0"
          memory: "1.5G"
    security_opt:
      - no-new-privileges:true
    read_only: false
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import asyncio; from aisynergix.ai.manager import get_ai_manager; asyncio.run(get_ai_manager().health_check())",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
